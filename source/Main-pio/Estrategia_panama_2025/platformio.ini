; PlatformIO Project Configuration File
;
; ===========================================================================
; SIX ENVIRONMENTS, ONE PROJECT
; ===========================================================================
; Each [env:...] below compiles a DIFFERENT set of source files, chosen by its
; build_src_filter. Only one of them ever sees a setup()/loop() pair, so they
; cannot collide, and they share the same libraries and the same lib/move/
; movement code.
;
;   general          competition firmware, general strategy   src/generalStrategy.cpp
;   control          competition firmware, control strategy   src/controlStrategy.cpp
;   square_test      movement bench test        src/test/square_test.cpp
;   strafe_test      strafe bench test, Bluetooth table  src/test/strafe_test.cpp
;   heading_test     BNO08x readout, no motion  src/test/heading_test.cpp
;   bt_passthrough   Bluetooth module AT bench  src/test/bt_passthrough.cpp
;
; The two competition environments are identical except for which strategy
; file they compile (Strategy.h). The robot is selected in Hardware.cpp.
;
; WHICH ONE GETS BUILT
; --------------------
; `default_envs` is what the VSCode toolbar buttons and a bare `pio run` use.
; Or choose explicitly, without editing this file:
;   pio run -e general         -t upload      flash the general strategy
;   pio run -e control         -t upload      flash the control strategy
;   pio run -e square_test     -t upload      flash the movement test
;   pio run -e strafe_test     -t upload      flash the strafe test (moves at once)
;   pio run -e heading_test    -t upload      flash the sensor readout
;   pio run -e bt_passthrough  -t upload      flash the Bluetooth module bench
;   pio device monitor -e <env>               watch its output at the right baud
;
; In VSCode: PlatformIO sidebar -> Project Tasks -> <env> -> Upload. The bottom
; toolbar buttons only ever use default_envs. The strategy that is running
; prints its name on the USB boot line and in the Bluetooth status block.
;
; TELEMETRY OVER BLUETOOTH ON A LAPTOP
; ------------------------------------
; Pair the module in Windows (PIN 1234); Windows creates an Outgoing virtual
; COM port for it (Settings -> Bluetooth & devices -> Devices -> More Bluetooth
; settings -> COM Ports). Open that port with the same monitor:
;   pio device monitor -p COMx -b 9600        pio device list shows the ports
; Opening the port is what connects the laptop. The toolbar monitor button
; keeps opening the USB port.
;
; TO ADD ANOTHER STRATEGY
; -----------------------
; Copy src/controlStrategy.cpp, copy the [env:control] block, and exclude the
; other strategy files in its filter.
;
; TO ADD ANOTHER TEST
; -------------------
; Drop it in src/test/, copy the [env:square_test] block and point its filter at
; the new file. src/test/ is excluded from the competition builds, so nothing
; you put there can affect what competes.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = general

; Shared by all environments.
[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
	adafruit/Adafruit Motor Shield library@^1.0.1
	arduino-libraries/Servo@^1.3.0
	adafruit/Adafruit BNO08x@^1.2.5
	adafruit/Adafruit Unified Sensor@^1.1.14

; ---------------------------------------------------------------------------
; Competition firmware: everything in src/ except the test programs and the
; other strategy. One environment per strategy.
;
; SERIAL_TX_BUFFER_SIZE doubles the UART transmit buffers (default 64) so the
; telemetry lines (Sensors.cpp) fit in one go and write() never waits for the
; UART. Applies to Serial (USB) and Serial2 (Bluetooth) alike.
; ---------------------------------------------------------------------------
[env:general]
build_src_filter = +<*> -<test/> -<controlStrategy.cpp>
build_flags = -D SERIAL_TX_BUFFER_SIZE=128
monitor_speed = 115200

[env:control]
build_src_filter = +<*> -<test/> -<generalStrategy.cpp>
build_flags = -D SERIAL_TX_BUFFER_SIZE=128
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Movement bench test. Compiles only what a movement test needs:
;   Hardware.cpp    which robot and its tuned values, the motors and the Move
;                   instance
;   Sensors.cpp     the encoders and the BNO08x (the camera object comes with
;                   them but is never initialised)
; Deliberately NOT generalStrategy.cpp or main.cpp - no strategy, so a fault
; there cannot affect this test.
; ---------------------------------------------------------------------------
[env:square_test]
build_src_filter = -<*> +<test/square_test.cpp> +<Hardware.cpp> +<Sensors.cpp>
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Strafe bench test. 500 mm RIGHT, pause, 500 mm LEFT, pause, repeated, from
; the moment it boots - THE ROBOT MOVES AS SOON AS IT IS POWERED.
;
; Compiles what square_test compiles and prints the competition telemetry
; table (Sensors.cpp) on USB and Bluetooth, so it needs the same
; SERIAL_TX_BUFFER_SIZE as the competition builds: a row is 84 characters
; and the default 64-byte transmit buffer can never take one whole.
; ---------------------------------------------------------------------------
[env:strafe_test]
build_src_filter = -<*> +<test/strafe_test.cpp> +<Hardware.cpp> +<Sensors.cpp>
build_flags = -D SERIAL_TX_BUFFER_SIZE=128
monitor_speed = 115200

; ---------------------------------------------------------------------------
; BNO08x readout only. THE ROBOT DOES NOT MOVE.
;
; Compiles just the test and Sensors.cpp - no motors and no Move, so it runs
; and tells you the truth about the sensor even if the motor shield is
; unpowered, miswired, or the movement code is mid-rewrite.
; ---------------------------------------------------------------------------
[env:heading_test]
build_src_filter = -<*> +<test/heading_test.cpp> +<Sensors.cpp>
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Bluetooth module bench. THE ROBOT DOES NOT MOVE.
;
; Bridges the USB monitor to the module on Serial2 (pins 16/17) so its AT
; commands can be sent: check it answers, rename it, change its PIN or baud.
; Only the two UARTs are compiled. monitor_echo shows what you type.
; ---------------------------------------------------------------------------
[env:bt_passthrough]
build_src_filter = -<*> +<test/bt_passthrough.cpp>
monitor_speed = 115200
monitor_echo = yes

; PlatformIO Project Configuration File
;
; ===========================================================================
; THREE ENVIRONMENTS, ONE PROJECT
; ===========================================================================
; Each [env:...] below compiles a DIFFERENT set of source files, chosen by its
; build_src_filter. Only one of them ever sees a setup()/loop() pair, so they
; cannot collide, and they share the same libraries and the same lib/move/
; movement code.
;
;   megaatmega2560   the competition firmware   src/main.cpp + every module
;   square_test      movement bench test        src/test/square_test.cpp
;   heading_test     BNO08x readout, no motion  src/test/heading_test.cpp
;
; WHICH ONE GETS BUILT
; --------------------
; `default_envs` is what the VSCode toolbar buttons and a bare `pio run` use.
; Or choose explicitly, without editing this file:
;   pio run -e megaatmega2560  -t upload      flash the competition firmware
;   pio run -e square_test     -t upload      flash the movement test
;   pio run -e heading_test    -t upload      flash the sensor readout
;   pio device monitor -e <env>               watch its output at the right baud
;
; In VSCode: PlatformIO sidebar -> Project Tasks -> <env> -> Upload. The bottom
; toolbar buttons only ever use default_envs.
;
; TO ADD ANOTHER TEST OR STRATEGY
; -------------------------------
; Drop it in src/test/, copy the [env:square_test] block and point its filter at
; the new file. src/test/ is excluded from the competition build, so nothing you
; put there can affect what competes.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = megaatmega2560

; Shared by all environments.
[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
	adafruit/Adafruit Motor Shield library@^1.0.1
	arduino-libraries/Servo@^1.3.0
	adafruit/Adafruit BNO08x@^1.2.5
	adafruit/Adafruit Unified Sensor@^1.1.14

; ---------------------------------------------------------------------------
; Competition firmware: everything in src/ except the test programs.
; ---------------------------------------------------------------------------
[env:megaatmega2560]
build_src_filter = +<*> -<test/>
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Movement bench test. Compiles only what a movement test needs:
;   Hardware.cpp    the motors, encoders and the Move instance
;   RobotConfig.cpp which robot, and its tuned values
;   Motion.cpp      mm()
;   Heading.cpp     the BNO08x
; Deliberately NOT Routines.cpp, Sensors.cpp or main.cpp - no camera and no
; strategy, so a fault in either cannot affect this test.
; ---------------------------------------------------------------------------
[env:square_test]
build_src_filter = -<*> +<test/square_test.cpp> +<Hardware.cpp> +<RobotConfig.cpp> +<Motion.cpp> +<Heading.cpp>
monitor_speed = 115200

; ---------------------------------------------------------------------------
; BNO08x readout only. THE ROBOT DOES NOT MOVE.
;
; Compiles just the test and Heading.cpp - no drivetrain at all, so it runs and
; tells you the truth about the sensor even if the motor shield is unpowered,
; miswired, or the movement code is mid-rewrite.
; ---------------------------------------------------------------------------
[env:heading_test]
build_src_filter = -<*> +<test/heading_test.cpp> +<Heading.cpp>
monitor_speed = 115200
